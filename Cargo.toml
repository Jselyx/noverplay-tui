[package]
name = "noverplay-tui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Терминальный музыкальный клиент Noverplay"

[[bin]]
name = "noverplay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
crossbeam-channel = "0.5"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
keyring = "4"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
symphonia = { version = "0.6", default-features = false, features = ["aac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
yandex-music = "0.4.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
